name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Shipped dependencies only; known dev-only advisories are documented in SECURITY.md
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # tests/visual-crop.test.ts extracts frames from the camera fixtures with ffmpeg
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Test
        run: npm run test -- --passWithNoTests

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No Supabase env vars: account features stay off and the opt-in pairing/passkey specs skip
      - name: Build
        run: npm run build

      # WebKit is left out: most specs skip there anyway (Playwright's WebKit can't store Blobs in IndexedDB)
      - name: E2E tests against the production server
        run: npx playwright test --project="iPhone Camera (Chromium)" --project="Desktop Chrome"
        env:
          E2E_SERVER: prod

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  live-llm:
    name: Live LLM Tests
    runs-on: ubuntu-latest
    # Fork PRs get no secrets; the tests would only skip
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Live LLM tests
        run: npm run test:live
        env:
          CUSTOM_LLM_KEY: ${{ secrets.CUSTOM_LLM_KEY }}
          CUSTOM_LLM_BASE_URL: https://ollama.com/v1
          CUSTOM_LLM_MODEL: gemma4:31b
